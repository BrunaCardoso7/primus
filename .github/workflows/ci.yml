name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pip-tools
          pip install -r requirements/dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Tests
        run: pytest
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          PYTHONPATH: .

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t primus-api .

      - name: Login Docker
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Push image
        run: |
          docker tag primus-api ${{ secrets.DOCKER_USER }}/primus-api:latest
          docker push ${{ secrets.DOCKER_USER }}/primus-api:latest